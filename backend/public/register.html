<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Sistema de Tickets</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 400px; }
    form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    div { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    .login-link { margin-top: 15px; text-align: center; }
    .login-link a { color: #007bff; text-decoration: none; }
  </style>
</head>
<body>

  <h2>Criar Conta</h2>
  <form id="registerForm">
    <div>
      <label for="regName">Nome Completo:</label>
      <input type="text" id="regName" required>
    </div>
    <div>
      <label for="regEmail">E-mail:</label>
      <input type="email" id="regEmail" required>
    </div>
    <div>
      <label for="regPassword">Senha:</label>
      <input type="password" id="regPassword" required>
    </div>
    <button type="submit">Cadastrar</button>

    <div class="login-link">
      Já tem uma conta? <a href="login.html">Voltar ao Login</a>
    </div>
  </form>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const response = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value
        })
      });

      const data = await response.json();

      if (response.ok) {
        alert("Cadastro realizado! Redirecionando para a tela de login...");
        window.location.href = '/login.html';
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
