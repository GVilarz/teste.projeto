<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Sistema de Tickets</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 400px; display: flex; flex-direction: column; min-height: 80vh; }
    .content { flex: 1; }
    form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    div { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    .signup-link { margin-top: 15px; text-align: center; }
    .signup-link a { color: #007bff; text-decoration: none; font-weight: bold; }

    /* Estilo do Rodapé e Cadeado */
    footer { margin-top: 30px; text-align: center; color: #666; font-size: 13px; }
    .lock-btn { cursor: pointer; font-size: 22px; background: none; border: none; opacity: 0.4; transition: opacity 0.2s; }
    .lock-btn:hover { opacity: 1; }

    /* Estilo da Janela Modal (Admin) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 320px; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-weight: bold; font-size: 20px; }
  </style>
  <link rel="stylesheet" href="CSS/login.css">
</head>
<body>

  <div class="content">
    <h2>Entrar no Sistema</h2>
    <form id="loginForm">
      <div>
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div>
        <label for="loginPassword">Senha:</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit">Entrar</button>

      <div class="signup-link">
        Não tem cadastro? <a href="register.html">Clique aqui</a>
      </div>
    </form>
  </div>

  <!-- RODAPÉ COM O CADEADO DO ADMIN -->
  <footer>
    <p>© 2026 Sistema de Suporte</p>
    <button class="lock-btn" id="openAdminModal" title="Acesso Restrito ao Administrador">🔒</button>
  </footer>

  <!-- MODAL DE LOGIN RESTRITO DO ADMIN -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <span class="close-btn" id="closeAdminModal">&times;</span>
      <h3>🔐 ÁREA RESTRITA</h3>
      <form id="adminLoginForm">
        <div>
          <label>E-mail Admin:</label>
          <input type="email" id="adminEmail" required>
        </div>
        <div>
          <label>Senha:</label>
          <input type="password" id="adminPassword" required>
        </div>
        <button type="submit" style="background: #dc3545;">Acessar Painel</button>
      </form>
    </div>
  </div>

  <script>
    // Controle de Exibição do Modal
    const modal = document.getElementById('adminModal');
    document.getElementById('openAdminModal').onclick = () => modal.style.display = 'flex';
    document.getElementById('closeAdminModal').onclick = () => modal.style.display = 'none';

    // 1. Login Comum (Usuários e Técnicos)
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('user', JSON.stringify(data.user));
        
        // Redireciona de acordo com a 'role'
        if (data.user.role === 'tecnico') {
          window.location.href = '/tecnico.html';
        } else {
          window.location.href = '/dashboard.html';
        }
      } else {
        alert(data.error);
      }
    });

    // 2. Login EXCLUSIVO do Administrador (Pelo Cadeado)
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const response = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('adminEmail').value,
          password: document.getElementById('adminPassword').value
        })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/admin.html';
      } else {
        alert(data.error); // Mostra erro de 'Acesso negado' se não for admin
      }
    });
  </script>
</body>
</html>
